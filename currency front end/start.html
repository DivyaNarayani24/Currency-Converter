<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PocketXchange - Converter</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            background-color: #1a1a1a;
            color: #ffc0cb;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Floating currency symbols */
        .floating-symbol {
            position: absolute;
            font-size: 2rem;
            opacity: 0.7;
            animation: float linear infinite;
            transition: transform 0.3s, opacity 0.3s;
            z-index: 1;
        }

        .floating-symbol:hover {
            transform: scale(1.3) rotate(10deg);
            opacity: 1;
            cursor: pointer;
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); }
            100% { transform: translateY(-10vh) translateX(30px); }
        }

        /* Fixed converter panel */
        .container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            background-color: #330033;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(255,51,102,0.3);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        h1 { color: #ff3366; margin-bottom: 20px; }

        input[type="number"] {
            padding: 10px;
            font-size: 1rem;
            width: 200px;
            border-radius: 5px;
            border: none;
            margin-bottom: 20px;
            text-align: center;
            background-color: #330033;
            color: #ffc0cb;
            outline: none;
        }
        input[type="number"]::placeholder { color: #ff99cc; }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .currency-button {
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            background-color: #330033;
            color: #ffc0cb;
        }
        .currency-button:hover {
            background-color: #ff3366;
            color: #fff;
            transform: scale(1.1);
        }

        #convertBtn {
            padding: 12px 25px;
            border-radius: 50px;
            border: none;
            background-color: #ff3366;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
        }
        #convertBtn:hover { transform: scale(1.05); }

        #result {
            margin-top: 30px;
            font-size: 1.5rem;
            color: #ffcccb;
        }

        /* Red shades for floating currency symbols */
        .usd { color: #ff3333; }
        .inr { color: #ff4d4d; }
        .eur { color: #ff1a1a; }
        .gbp { color: #ff6666; }
        .cad { color: #ff0000; }
        .jpy { color: #ff4d1a; }
        .rub { color: #ff1a4d; }
    </style>
</head>
<body>
    <!-- Floating currency symbols -->
    <div class="floating-symbol usd" style="left:5%; animation-duration:14s;">$</div>
    <div class="floating-symbol inr" style="left:15%; animation-duration:12s;">₹</div>
    <div class="floating-symbol eur" style="left:30%; animation-duration:16s;">€</div>
    <div class="floating-symbol  gbp" style="left:45%; animation-duration:10s;">£</div>
    <div class="floating-symbol cad" style="left:60%; animation-duration:18s;">C$</div>
    <div class="floating-symbol jpy" style="left:75%; animation-duration:15s;">¥</div>
    <div class="floating-symbol rub" style="left:90%; animation-duration:13s;">₽</div>

    <div class="container">
        <h1>PocketXchange Converter</h1>
        <input type="number" id="amount" placeholder="Amount" />

        <h3>Select Base Currency:</h3>
        <div id="baseContainer" class="button-container"></div>

        <h3>Select Target Currency:</h3>
        <div id="targetContainer" class="button-container"></div>

        <button id="convertBtn">Convert 🔄</button>

        <div id="result"></div>
    </div>
    <script src="start.js"></script>

</body>
</html>
