<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PocketXchange - Currency Converter</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            background-color: #1a1a1a; /* dark background */
            color: #ffc0cb; /* light pink text */
            text-align: center;
            position: relative;
        }

        /* Floating currency symbols */
        .floating-symbol {
            position: absolute;
            font-size: 2rem;
            opacity: 1;
            animation: float linear infinite;
            transition: transform 0.3s, opacity 0.3s;
        }

        .floating-symbol:hover {
            transform: scale(1.3) rotate(10deg);
            opacity: 1;
            cursor: pointer;
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); }
            100% { transform: translateY(-10vh) translateX(30px); }
        }

        /* Fixed PocketXchange panel */
        .container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            background-color: #330033; /* dark pink panel */
            color: #ffc0cb;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(255,51,102,0.3);
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #ff3366; /* bright red accent */
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            line-height: 1.5;
            color: #ffc0cb;
        }

        /* Fixed button style with flex for proper alignment */
        .start-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #ff3366; /* bright red button */
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255,51,102,0.3);
        }

        .start-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255,51,102,0.5);
        }

        .button-emoji {
            margin-left: 8px; /* spacing between text and emoji */
        }

        .emoji {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        /* Red shades for currency symbols */
        .usd { color: #ff3333; }  
        .inr { color: #ff4d4d; }  
        .eur { color: #ff1a1a; }  
        .gbp { color: #ff6666; }  
        .cad { color: #ff0000; }  
        .jpy { color: #ff4d1a; }  
        .rub { color: #ff1a4d; }  
    </style>
</head>
<body>
    <!-- Floating currency symbols -->
    <div class="floating-symbol usd" style="left:5%; animation-duration:14s;">$</div>
    <div class="floating-symbol inr" style="left:20%; animation-duration:12s;">₹</div>
    <div class="floating-symbol eur" style="left:35%; animation-duration:16s;">€</div>
    <div class="floating-symbol gbp" style="left:50%; animation-duration:10s;">£</div>
    <div class="floating-symbol cad" style="left:65%; animation-duration:18s;">C$</div>
    <div class="floating-symbol jpy" style="left:80%; animation-duration:15s;">¥</div>
    <div class="floating-symbol rub" style="left:90%; animation-duration:13s;">₽</div>

    <div class="container">
        <div class="emoji">💼💱</div>
        <h1>PocketXchange</h1>
        <p>Turn your pocket into a global wallet!</p>
        <button class="start-button" onclick="goToConverter()">
         <span class="button-emoji">Begin🔄</span>
        </button>
    </div>

    <script>
        function goToConverter() {
            window.location.href = "start.html"; // Replace with your actual conversion page URL
        }
    </script>
</body>
</html>
