<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PocketXchange — Currency Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <main class="card">

    <header class="card-header">
      <div class="logo">
        <!-- FIX 1: Removed odd ₿ symbol, replaced with clean text icon -->
        <span class="logo-icon">PX</span>
        <span class="logo-text">PocketXchange</span>
      </div>
      <p class="tagline">Live exchange rates · Powered by Frankfurter</p>
    </header>

    <!-- Amount Input -->
    <section class="amount-section">
      <label class="field-label" for="amount">Amount</label>
      <div class="amount-wrapper">
        <span class="amount-symbol" id="baseSymbol">?</span>
        <input
          type="number"
          id="amount"
          placeholder="0.00"
          min="0"
          step="any"
        />
      </div>
    </section>

    <!-- Currency Selectors -->
    <section class="selectors-section">

      <div class="selector-block">
        <label class="field-label">From</label>
        <!-- FIX 2: currency-grid will show code + full name (built in JS) -->
        <div class="currency-grid" id="baseContainer"></div>
      </div>

      <!-- Swap Button -->
      <button class="swap-btn" id="swapBtn" title="Swap currencies">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 16V4m0 0L3 8m4-4l4 4"/>
          <path d="M17 8v12m0 0l4-4m-4 4l-4-4"/>
        </svg>
      </button>

      <div class="selector-block">
        <label class="field-label">To</label>
        <div class="currency-grid" id="targetContainer"></div>
      </div>

    </section>

    <!-- FIX 3: Convert button — just "Convert", no loading dots -->
    <button class="convert-btn" id="convertBtn">
      Convert
    </button>

    <!-- Result -->
    <div class="result-box" id="resultBox" hidden>
      <div class="result-amount" id="resultAmount"></div>
      <div class="result-meta" id="resultMeta"></div>
    </div>

    <div class="error-box" id="errorBox" hidden></div>

  </main>

  <script src="script.js"></script>
</body>
</html>
